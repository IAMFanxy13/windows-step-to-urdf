name: CodeQL
on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 2'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@v3
